<script src="../common/js/lesson-ui.js"></script><script src="../common/js/entry-engine/grammar.js"></script><script src="../common/js/entry-engine/tabs.js"></script><script src="../common/js/entry-engine/renderer.js?v=20261020-placement3"></script><script src="../common/js/entry-engine/execution.js"></script><script src="../common/js/entry-engine/steps.js"></script><script src="../common/js/entry-engine/objects.js?v=20261023-objects1"></script><script src="../common/js/coding-setup.js?v=20261023-preview-direction1"></script><script type="application/json" id="deviceConceptData">{"name":"가변저항","type":"아날로그 입력 장치","page":48,"concept":"저항값을 조절하여 0~1023 사이의 값을 입력받을 수 있는 장치","paragraphs":["저항은 물체의 전기 흐름을 억제하여 전류의 양을 조절하는 전자 부품으로, 저항마다 저항값의 크기가 정해져 있다. 반면, <mark data-key=\"1\">가변 저항(Potentiometer)은 저항값을 임의로 조절</mark>하여 전기 회로에 흐르는 전류의 값을 다양하게 변화시킬 수 있는 <mark data-key=\"2\">아날로그 입력 장치</mark>이다. 손잡이를 시계 방향으로 돌리면 저항값이 증가하고 반시계 방향으로 돌리면 감소하여 저항값을 조절할 수 있으며, <mark data-key=\"2\">0~1023 사이의 값으로 입력</mark>된다. 극성이 없는 단자로 구성되어 있어 <mark data-key=\"3\">VCC와 GND를 서로 바꿔 연결하면 가변 저항의 값의 범위가 뒤바뀐다</mark>.","손잡이를 돌리는 대신 슬라이드를 좌우로 움직여 저항값을 조절할 수 있는 슬라이드 가변 저항도 있으며, 음악 볼륨, 라디오 주파수, 조명 밝기 제어 등 가전제품부터 산업용 제품까지 실생활의 다양한 분야에서 활용되고 있다."],"notes":["일반 저항은 저항값이 정해져 있지만, 가변저항은 손잡이나 슬라이더를 움직여 저항값을 바꿀 수 있다.","두 가지 상태만 구분하는 것이 아니라 0부터 1023까지의 범위로 상태를 읽을 수 있다.","전원 연결 방향을 바꾸면 손잡이를 움직였을 때 입력값이 증가·감소하는 방향도 반대로 바뀐다."],"subtitle":"개념","supplements":[{"title":"저항","side":"left","paragraphs":["330Ω, 1㏀, 10㏀ 등 다양한 값의 저항이 있다."],"image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXwAAAEECAIAAACk9BgxAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAVoElEQVR4nO3da1Bb6X3HcbbTvvH0RdsXzYtM6kwy2Uumk7bpZnaymWbSGXfdTLaTXjbNrDvdNJsms9l20nQzO5PZdFpAYMBXfF3b67X3YnTjIm4GgwGDscFgbkaAMT5HF0BIIAlJBoSEpOM+WI5WRiAJfPQ8Oo9+n/m/YmXPX8/kfCPJSMp7CABAUR7rBQAgtyA6AEAVogMAVCE6AEAVogMAVCE6AEAVogMAVCE6AEAVogMAVCE6AEAVosMbKRzyXr/s/d9fLv3jKyt/9fXlPd/0/OonC/2NKw4T69U2sTQzSXab7Ki6c7V6pLXS2F5zv7vROXFLioRZrwaZgujwQ5Ikt7HLUnfM9forD/PyYrP63G6Tfv/9inxL/QnP5C3Wa6
