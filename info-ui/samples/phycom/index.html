<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>2022 중학교 피지컬 컴퓨팅 · UI 샘플</title><link rel="stylesheet" href="../../common/css/tokens.css"><link rel="stylesheet" href="../../common/css/layout.css"><link rel="stylesheet" href="../../common/css/components.css"><link rel="stylesheet" href="../../themes/phycom/theme.css?v=20261005-palette2"><link rel="stylesheet" href="shell.css?v=20261005-palette2"></head><body><main class="lesson-screen theme-phycom"><span class="circuit-mark" aria-hidden="true"></span><header class="hero"><div><span class="badge">2022 개정 교육과정</span><h1>2022 중학교 <span class="title-physical">피지컬</span> <span class="title-computing">컴퓨팅</span></h1><p>센서와 액추에이터로 배우는 세상의 연결</p></div><div class="hero-art"><strong>코딩으로,<br>세상을 움직이다!</strong><img src="../../assets/entrybot.png" alt="엔트리봇 캐릭터"></div></header><div class="device-panels"><section class="panel inputs" aria-labelledby="input-title"><header class="panel-heading"><span class="section-icon" aria-hidden="true">↘</span><h2 id="input-title">입력장치</h2><p>세상의 신호를 읽어요</p></header><div class="card-grid"><button class="device-card" data-info="버튼"><span class="sensor-symbol button-symbol" aria-hidden="true"></span><strong>버튼</strong><small>눌러서 신호 보내기</small><span class="status">준비 중</span></button><button class="device-card" data-info="초음파 센서"><span class="sensor-symbol ultrasonic-symbol" aria-hidden="true">◉ ◉</span><strong>초음파 센서</strong><small>거리 감지하기</small><span class="status">준비 중</span></button><button class="device-card" data-info="빛 센서"><span class="sensor-symbol light-symbol" aria-hidden="true">☀</span><strong>빛 센서</strong><small>밝기 감지하기</small><span class="status">준비 중</span></button><button class="device-card" data-info="가변저항"><span class="sensor-symbol rotation-symbol" aria-hidden="true">◴</span><strong>가변저항</strong><small>회전으로 값 바꾸기</small><span class="status">준비 중</span></button><button class="device-card" data-info="조이스틱"><span class="sensor-symbol joystick-symbol" aria-hidden="true">✥</span><strong>조이스틱</strong><small>방향 입력하기</small><span class="status">준비 중</span></button><div class="welcome-tile"><span aria-hidden="true">＋</span><strong>입력 → 처리 → 출력</strong><p>연결하고 코딩하며<br>새로운 작품을 만들어요.</p></div></div></section><section class="panel outputs" aria-labelledby="output-title"><header class="panel-heading"><span class="section-icon" aria-hidden="true">↗</span><h2 id="output-title">출력장치</h2><p>코드로 움직여요</p></header><div class="card-grid"><button class="device-card" type="button" data-open-module="led"><img src="../../assets/LED_white.png" alt="LED 모듈"><strong>LED</strong><small>빛으로 표현하기</small><span class="status">전체 수업 샘플 보기 →</span></button><button class="device-card" type="button" data-open-module="buzzer" aria-label="수동버저 전체 디자인 샘플 열기"><img src="../../assets/buzzer.png" alt="수동버저 모듈"><strong>수동버저</strong><small>소리로 표현하기</small><span class="status">전체 수업 샘플 보기 →</span></button><button class="device-card" type="button" data-open-module="servo-motor"><img src="../../assets/servo_motor.png" alt="서보모터 모듈"><strong>서보모터</strong><small>각도 조절하기</small><span class="status">전체 수업 샘플 보기 →</span></button><button class="device-card" type="button" data-open-module="dc-motor"><img src="../../assets/dc_motor.png" alt="DC모터 모듈"><strong>DC모터</strong><small>회전시키기</small><span class="status">전체 수업 샘플 보기 →</span></button></div></section></div><footer class="screen-footer"><p>작은 신호에서 시작하는 나만의 디지털 세상</p><nav class="footer-nav" aria-label="학습 메뉴"><a class="button primary" href="entry/">Entry로 코딩하기 →</a><button class="button" data-fullscreen aria-label="전체화면 전환">⛶ 전체화면</button></nav></footer></main><section class="buzzer-shell" id="buzzerShell" hidden aria-label="수동버저 디자인 샘플"><iframe id="buzzerFrame" title="수동버저 전체 디자인 샘플" src="about:blank" allow="fullscreen"></iframe></section><style>.buzzer-shell[hidden]{display:none}.buzzer-shell{position:fixed;inset:0;z-index:1000;background:#fff;display:flex;flex-direction:column}.buzzer-shell iframe{width:100%;height:100%;border:0;min-height:0}.buzzer-home{position:absolute;z-index:5;top:10px;left:10px;padding:8px 14px;border:0;border-radius:24px;background:#153f58;color:white;font:700 15px system-ui;box-shadow:0 2px 8px #0003}.lesson-screen:has(.buzzer-shell:not([hidden])){visibility:hidden}@media(max-aspect-ratio:4/5){.buzzer-shell iframe{height:100svh}}</style><dialog class="dialog"><h2></h2><p>이 장치의 수업자료는 준비 중입니다.<br>출력장치에서 Entry 코드 화면을 살펴보세요.</p><button data-close>닫기</button></dialog><script src="../../common/js/info-ui.js"></script><script src="../../common/creator-config.js"></script><script src="lesson-fullscreen.js?v=20261006-1"></script><script src="shell.js?v=20261006-fullscreen1"></script></body></html>
